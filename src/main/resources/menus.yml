        name: "&#FFD700[Legend] &7(30 дней)"
        lore:
          - ""
          - "&7Префикс: &#FFD700[Legend]"
          - "%group_line%"
          - "%cost_line%"
          - "%permission_line%"
          - "%duration_line%"
          - ""
          - "%status%"
          - "&7Осталось: &f%time_left%"
          - ""
        prefix: "&#FFD700[Legend] &r"
        group: "legend"
        cost: 1500
        permission: "dprefixes.prefix.legend"
        duration: "30d"

      legend_forever:
        material: GOLD_BLOCK
        category: "legend"
        name: "&#FFD700[Legend] &7(навсегда)"
        lore:
          - ""
          - "&7Префикс: &#FFD700[Legend]"
          - "%group_line%"
          - "%cost_line%"
          - "%permission_line%"
          - "%duration_line%"
          - ""
          - "%status%"
          - ""
        prefix: "&#FFD700[Legend] &r"
        group: "legend"
        cost: 5000
        permission: "dprefixes.prefix.legend"
        duration: "permanent"

  # ============================================================
